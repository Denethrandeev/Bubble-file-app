name: bubble_file_manager
description: Bubble File Manager - Safety and Relax File Management System.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  sensors_plus: ^6.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  exif: ^3.3.0
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  open_filex: ^4.7.0
  video_player: ^2.9.2
  media_metadata: ^2.2.2
  archive: ^3.6.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  face_detection_tflite: ^6.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
