name: aqua_file_manager
description: Aqua File Manager - immersive water bubble Android file manager.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  sensors_plus: ^6.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
